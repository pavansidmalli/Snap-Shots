<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Vibrant Brand Red to Orange Gradient for Camera Outline -->
    <linearGradient id="camGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd1616"/>
      <stop offset="60%" stop-color="#ff3b00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Warm Under-Camera Ambient Glow -->
    <filter id="underGlowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
    </filter>

    <!-- Lens Bezel Gradient -->
    <linearGradient id="lensRingLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#bd1616"/>
    </linearGradient>
  </defs>

  <g>
    <!-- 1. Word 's n a p' (Bold Spaced Pure White) -->
    <!-- s -->
    <text x="26" y="86" fill="#ffffff" font-family="'Montserrat', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="62">s</text>
    <!-- n -->
    <text x="82" y="86" fill="#ffffff" font-family="'Montserrat', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="62">n</text>
    <!-- a -->
    <text x="144" y="86" fill="#ffffff" font-family="'Montserrat', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="62">a</text>
    <!-- p -->
    <text x="204" y="86" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="62">p</text>

    <!-- 2. Letters 'sh' (Signature Brand Red) -->
    <text x="266" y="86" fill="#bd1616" font-family="'Plus Jakarta Sans', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="62">sh</text>

    <!-- 3. Camera Icon (Exact Match to Live Website Screenshot) -->
    <!-- Warm orange/red glow under the camera base -->
    <ellipse cx="366" cy="94" rx="44" ry="10" fill="#ff5500" opacity="0.65" filter="url(#underGlowLight)"/>
    <ellipse cx="366" cy="92" rx="36" ry="8" fill="#bd1616" opacity="0.75" filter="url(#underGlowLight)"/>

    <!-- Camera Top Shutter Button & Flash Notch -->
    <rect x="344" y="24" width="16" height="6" rx="3" fill="#bd1616"/>
    <rect x="368" y="26" width="20" height="4.5" rx="2.25" fill="#ff9900"/>

    <!-- Camera Main Body Outer Rounded Rect -->
    <rect x="330" y="32" width="72" height="56" rx="13" stroke="url(#camGradLight)" stroke-width="5" fill="#000000" fill-opacity="0.3"/>

    <!-- Camera Lens Outer Ring Bezel -->
    <circle cx="366" cy="60" r="22.5" fill="#0a0a0a" stroke="url(#lensRingLight)" stroke-width="3.5"/>
    <circle cx="366" cy="60" r="18" fill="#111111" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- 8-Blade Aperture Iris Wheel (Star Aperture) -->
    <g transform="translate(366, 60)" fill="#ffffff" stroke="#000000" stroke-width="1.4">
      <path d="M-15 -9 L0 -19 L-4 -9 Z"/>
      <path d="M-2 -18 L13 -13 L3 -9 Z"/>
      <path d="M11 -14 L18 1 L9 -1 Z"/>
      <path d="M17 0 L14 15 L7 7 Z"/>
      <path d="M14 14 L0 19 L5 9 Z"/>
      <path d="M2 18 L-13 13 L-3 9 Z"/>
      <path d="M-11 14 L-18 0 L-8 2 Z"/>
      <path d="M-18 1 L-14 -15 L-7 -7 Z"/>
    </g>

    <!-- Center Hub of Aperture Lens -->
    <circle cx="366" cy="60" r="8.5" fill="#0a0a0a" stroke="#bd1616" stroke-width="1.6"/>
    <!-- Red Inner Star / Center Play Dot -->
    <polygon points="364,56 370,60 364,64" fill="#bd1616"/>

    <!-- 4. Letter 't' (Signature Brand Red) -->
    <text x="418" y="86" fill="#bd1616" font-family="'Plus Jakarta Sans', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="62">t</text>

    <!-- 5. Letter 's' (Pure White) -->
    <text x="450" y="86" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="62">s</text>
  </g>
</svg>
