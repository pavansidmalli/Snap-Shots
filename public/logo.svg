<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 135" width="660" height="135" fill="none">
  <defs>
    <!-- Fiery Orange to Golden Yellow gradient for h, camera, and swoosh -->
    <linearGradient id="fieryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3000"/>
      <stop offset="35%" stop-color="#FF6B00"/>
      <stop offset="70%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#FFD000"/>
    </linearGradient>

    <!-- Orange Gradient for 'h' and 't' -->
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3800"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>

    <!-- Yellow-gold Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A00"/>
      <stop offset="40%" stop-color="#FFA000"/>
      <stop offset="80%" stop-color="#FFC800"/>
      <stop offset="100%" stop-color="#FFE033"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter for Pop on Dark/Glass Backgrounds -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- 1. Letter 's' (Crisp White) -->
    <text x="18" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">s</text>

    <!-- 2. Letter 'n' (Crisp White) -->
    <text x="64" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">n</text>

    <!-- 3. Letter 'a' (Crisp White) with Rewind ◀◀ inside -->
    <text x="118" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">a</text>
    <!-- Rewind triangles inside 'a' counter -->
    <path d="M148 69 L154 64 L154 74 Z" fill="#000000"/>
    <path d="M141 69 L147 64 L147 74 Z" fill="#000000"/>

    <!-- 4. Letter 'p' (Crisp White) with Fast-Forward ▶▶ inside -->
    <text x="168" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">p</text>
    <!-- Fast-forward triangles inside 'p' counter -->
    <path d="M194 69 L188 64 L188 74 Z" fill="#000000"/>
    <path d="M201 69 L195 64 L195 74 Z" fill="#000000"/>

    <!-- 5. Letter 's' (Crisp White - completing 'snaps') -->
    <text x="218" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">s</text>

    <!-- 6. Letter 'h' (Fiery Orange/Red Gradient with sweeping underline swoosh) -->
    <!-- Tall left stem of 'h' -->
    <path d="M272 26 L292 26 L292 90 L272 90 Z" fill="url(#hGrad)"/>
    <!-- Arch shoulder and right leg connecting to underline swoosh -->
    <path d="M292 56 C292 42, 304 38, 318 38 C332 38, 342 45, 342 60 L342 90 C342 102, 352 105, 368 105 L555 105 C565 105, 580 102, 592 98 C570 102, 545 103, 362 103 C340 103, 322 96, 322 84 L322 62 C322 52, 316 48, 308 48 C300 48, 292 52, 292 62 Z" fill="url(#swooshGrad)"/>
    <!-- Long tapering yellow underline swoosh -->
    <path d="M342 90 C342 104, 356 107, 375 107 L575 107 C588 107, 602 103, 610 99 C590 103, 560 105, 380 105 C350 105, 335 98, 335 88 Z" fill="url(#swooshGrad)"/>

    <!-- 7. Stylized Camera Top Frame & Red Shutter Button -->
    <!-- Top red shutter button -->
    <rect x="444" y="16" width="18" height="6" rx="3" fill="#D60000"/>
    
    <!-- Camera upper bracket line above lens -->
    <path d="M402 36 C402 26, 412 24, 424 24 L472 24 C482 24, 490 28, 492 36" stroke="url(#fieryGrad)" stroke-width="6.5" stroke-linecap="round" fill="none"/>

    <!-- 8. Letter 'o' as Camera Aperture Lens -->
    <g transform="translate(448, 69)">
      <!-- Outer white lens ring -->
      <circle cx="0" cy="0" r="29" fill="#050505" stroke="#FFFFFF" stroke-width="4.5"/>
      <circle cx="0" cy="0" r="24" fill="#000000" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45"/>
      
      <!-- 8 Aperture Blades -->
      <g stroke="#000000" stroke-width="1.6" fill="#FFFFFF">
        <path d="M-20 -11 L0 -24 L-5 -11 Z"/>
        <path d="M-3 -23 L17 -17 L4 -12 Z"/>
        <path d="M15 -18 L23 1 L11 -2 Z"/>
        <path d="M22 0 L18 20 L9 9 Z"/>
        <path d="M19 18 L0 24 L6 11 Z"/>
        <path d="M2 23 L-17 17 L-4 12 Z"/>
        <path d="M-16 17 L-23 0 L-10 3 Z"/>
        <path d="M-23 1 L-19 -19 L-9 -8 Z"/>
      </g>

      <!-- Center Inner Aperture Hole (Black Circle) -->
      <circle cx="0" cy="0" r="11" fill="#000000" stroke="#FFFFFF" stroke-width="1.2"/>

      <!-- Red Play Triangle ▶ at Center -->
      <polygon points="-3,-5 6,0 -3,5" fill="#E61919"/>
    </g>

    <!-- 9. Letter 't' (Fiery Orange/Red Gradient) -->
    <!-- Horizontal Crossbar and vertical stem -->
    <path d="M495 56 L540 56 L540 68 L524 68 L524 88 C524 94, 528 97, 534 97 L540 97 L540 104 C534 105, 526 105, 518 105 C506 105, 502 98, 502 88 L502 68 L495 68 Z" fill="url(#hGrad)"/>

    <!-- 10. Trailing Letter 's' (Crisp White) -->
    <text x="548" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">s</text>
  </g>
</svg>
